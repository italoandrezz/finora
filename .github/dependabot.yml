version: 2
# A configuração passa a valer quando este arquivo chegar à branch padrão (main).
# target-branch direciona PRs de versão; PRs de segurança continuam na main.
# Os grupos abaixo são somente de versão. Segurança permanece separada, sem
# restrições de versão impostas por estes blocos direcionados à develop.
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      backend-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Migrações principais exigem planejamento; correções na linha atual seguem.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Preserva Spring Boot 3.5.x, inclusive contra uma futura linha 3.6.
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ['version-update:semver-minor']

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # O primeiro grupo mantém React, React DOM e suas tipagens juntos.
      react-minor-patch:
        applies-to: version-updates
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
        update-types: [minor, patch]
      frontend-runtime-minor-patch:
        applies-to: version-updates
        dependency-type: production
        patterns: ['*']
        update-types: [minor, patch]
      frontend-tooling-minor-patch:
        applies-to: version-updates
        dependency-type: development
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Mantém React 19 e @types/node 24; demais majors são avaliados manualmente.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Preserva TypeScript 5.9.x e a compatibilidade com typescript-eslint.
      - dependency-name: typescript
        update-types: ['version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
    # Majors de Actions continuam disponíveis em PRs individuais para revisão.
