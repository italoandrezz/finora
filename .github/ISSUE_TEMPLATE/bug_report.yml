name: Relatar um problema
description: Descreva um comportamento inesperado do Finora.
title: "[Bug]: "
body:
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Não inclua senhas, tokens ou dados pessoais.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente e versão
